name: CI - Test Matrix

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node:
          - 18.x
          - 20.x
          - 22.x
          - 24.x
          - 26.x

        os: [ ubuntu-latest, macos-latest, windows-latest ]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies on Node.js-v18
        if: matrix.node == '18.x'
        run: |
          jq --arg version "4.0.18" '(.devDependencies //= {}) | .devDependencies["@vitest/coverage-v8"] = $version | .devDependencies["@vitest/ui"] = $version | .devDependencies["vitest"] = $version' package.json > package.json.tmp
          mv package.json.tmp package.json

          npm install

      - name: Install dependencies
        if: matrix.node != '18.x'
        run: |
          npm ci

      - name: Build
        run: |
          npm run build

      - name: Test
        run: |
          npm run test
